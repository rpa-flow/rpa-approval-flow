services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: approval_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - approval_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d approval_local"]
      interval: 3s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      DATABASE_URL: postgresql://local:local@db:5432/approval_local
      AUTH_SECRET: local-only-secret-do-not-use-in-production
      APP_BASE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
volumes:
  approval_db:
